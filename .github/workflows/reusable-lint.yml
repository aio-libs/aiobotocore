---
name: Reusable lint

permissions: {}

on:
  workflow_call:
    inputs:
      enable-cache:
        type: string
        required: true

env:
  FORCE_COLOR: 1

jobs:
  lint:
    name: Run pre-commit hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      UV_FROZEN: 1

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        submodules: true
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      with:
        # Pin uv so setup-uv skips the GitHub release-list API lookup
        # that otherwise resolves pyproject.toml's required-version
        # range. See claude.yml for the full reasoning.
        version: '0.11.33'
        enable-cache: ${{ inputs.enable-cache }}
    # Cache pre-commit's per-hook environments. Without this, the job
    # re-clones every hook repo (ruff, yamllint, rumdl, sphinx-lint,
    # check-jsonschema, ...) and rebuilds their venvs. Restore-keys lets
    # a partial hit salvage most of the cache when a single hook bumps.
    - name: Cache pre-commit hook envs
      # yamllint disable-line rule:line-length
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: pre-commit-${{ runner.os }}-
    - name: Run pre-commit hooks
      run: |
        uv run poe lint
    # tests/evals exercises plugins/, which the sdist excludes -- so the test
    # matrix, running out of the sdist, never sees them. The evals group is not
    # a default group because anthropic pulls httpx in transitively.
    - name: Run eval common tests
      run: |
        uv sync --group evals
        uv run pytest \
          --cov-report= \
          --cov=plugins/aiobotocore-bot/evals \
          --cov=tests/evals \
          tests/evals/test_common.py
        # pyproject's source_pkgs still applies on top of --cov, so without
        # --include this reports all of aiobotocore at ~0% and sinks the flag.
        uv run coverage xml --include='plugins/*,tests/evals/*'
    - name: Upload eval coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
      with:
        files: ./coverage.xml
        flags: evals-common
        name: codecov-umbrella
        fail_ci_if_error: true
        verbose: true
