---
name: Plugin evals

run-name: >-
  Evals:
  ${{ inputs.eval || 'both' }}
  (runs=${{ inputs.runs || '3' }}, limit=${{ inputs.limit || '8' }},
  model=${{ inputs.model || 'default' }}, effort=${{ inputs.effort || 'default' }}
  ${{ inputs.cases && format(', cases={0}', inputs.cases) || '' }})

permissions: {}

# Re-dispatching the same eval, model, effort and cases on a ref cancels the
# stale in-flight run, so a quick re-trigger doesn't double-spend tokens.
# Dispatches that differ in any of those run in parallel.
concurrency:
  group: evals-${{ github.ref }}-${{ inputs.eval }}-${{ inputs.model }}-${{ inputs.effort }}-${{ inputs.cases }}
  cancel-in-progress: true

on:
  # Manual, admin-only: workflow_dispatch requires repo write permission,
  # and the `claude` environment gates access to ANTHROPIC_API_KEY — which
  # narrows the trigger set to the aiobotocore-admins team plus other
  # users with explicit write access.
  #
  # No scheduled run: scenarios.yaml is a fixed committed set and the
  # classifier prompts only change via PR. A scheduled baseline adds no
  # signal beyond what running on demand after a relevant edit provides.
  workflow_dispatch:
    inputs:
      eval:
        description: Which eval to run
        required: false
        default: both
        type: choice
        options:
        - both
        - check-async-need
        - check-override-drift
        # not part of `both`: each case is a full agent run of up to 150 turns
        - check-porting
      model:
        description: Anthropic model ID (empty = DEFAULT_MODEL in evals/_common.py)
        required: false
        default: ''
        type: string
      effort:
        description: Effort level (empty = DEFAULT_EFFORT in evals/_common.py)
        required: false
        default: ''
        type: choice
        options:
        - ''
        - low
        - medium
        - high
        - xhigh
        - max
      runs:
        description: Runs per case (majority vote tolerates non-determinism)
        required: false
        default: '3'
        type: string
      limit:
        description: Max check-async-need scenarios (drift eval always runs full set)
        required: false
        default: '8'
        type: string
      cases:
        description: Comma-separated PR numbers to evaluate (empty = use limit)
        required: false
        default: ''
        type: string
      debug_misclassifications:
        description: On miss, ask the model which rule misled it (captured in JSON)
        required: false
        default: false
        type: boolean

jobs:
  check-async-need:
    if: inputs.eval == 'check-async-need' || inputs.eval == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: claude
    permissions:
      contents: read
    # Inputs land in env vars rather than being interpolated into `run:`
    # scripts — avoids shell-injection surface if inputs are ever changed
    # from typed choice/numeric strings to free text.
    env:
      EVAL_RUNS: ${{ inputs.runs || '3' }}
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_EFFORT: ${{ inputs.effort }}
      EVAL_LIMIT: ${{ inputs.limit || '8' }}
      EVAL_CASES: ${{ inputs.cases || '' }}
      EVAL_DEBUG_MISCLASSIFICATIONS: ${{ inputs.debug_misclassifications && '1' || '' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        # full history: the eval reads aiobotocore files at each sync's parent commit
        fetch-depth: 0
        persist-credentials: false

    - name: Cache botocore repo
      # Both evals read botocore at specific tags. Shares the cache key with
      # botocore-sync.yml; fresh tags are always fetched below.
      # yamllint disable-line rule:line-length
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: /tmp/botocore
        key: botocore-repo

    - name: Clone or update botocore
      # Mirrors botocore-sync.yml's step exactly. Bare clone is smaller
      # (~100MB vs ~200MB) and scenarios.yaml references tags back to
      # 1.35.x, far past what a shallow clone would cover. On cache hit
      # the fetch is ~2s; on cache miss the initial clone is ~10-15s.
      run: |
        if [ -f /tmp/botocore/HEAD ]; then
          git -C /tmp/botocore fetch --tags --prune
        else
          git clone --bare \
            https://github.com/boto/botocore.git \
            /tmp/botocore
        fi

    - name: Set up uv + Python
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      with:
        version: '0.11.33'
        python-version: '3.12'
        enable-cache: auto

    # .venv caching: setup-uv caches uv's download cache (wheels), but
    # `uv sync` still walks the lockfile and re-links the venv every
    # run (~5-15s). Caching .venv directly short-circuits that on
    # lockfile-unchanged runs. Invalidates on uv.lock or pyproject.toml
    # changes.
    - name: Cache .venv
      # yamllint disable-line rule:line-length
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .venv
        # yamllint disable-line rule:line-length
        key: venv-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock', 'pyproject.toml') }}

    - name: Install dependencies
      # --frozen is a guardrail: fail (not silently resolve) if uv.lock
      # is somehow out of sync with pyproject.toml. On a warm .venv
      # cache uv sync is near-instant; on a miss it re-links from the
      # uv download cache.
      # --group evals pulls in anthropic (kept out of default-groups so the
      # no-httpx test job stays httpx-free).
      run: uv sync --frozen --group evals

    - name: Run check_async_need eval
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        BOTOCORE_CLONE: /tmp/botocore
        # stack dump on a native crash; unbuffered so partial output survives it
        PYTHONFAULTHANDLER: '1'
        PYTHONUNBUFFERED: '1'
      run: |
        # `| tee` below would otherwise hide a crash of the eval process
        set -o pipefail
        case_args=()
        if [ -n "$EVAL_CASES" ]; then
          IFS=',' read -ra arr <<< "$EVAL_CASES"
          for n in "${arr[@]}"; do case_args+=(--case "${n// /}"); done
        fi
        model_args=()
        if [ -n "$EVAL_MODEL" ]; then model_args+=(--model "$EVAL_MODEL"); fi
        if [ -n "$EVAL_EFFORT" ]; then model_args+=(--effort "$EVAL_EFFORT"); fi
        debug_arg=()
        if [ -n "$EVAL_DEBUG_MISCLASSIFICATIONS" ]; then
          debug_arg=(--debug-misclassifications)
        fi
        uv run python plugins/aiobotocore-bot/evals/check_async_need.py \
          --runs "$EVAL_RUNS" \
          --limit "$EVAL_LIMIT" \
          "${case_args[@]}" \
          "${debug_arg[@]}" \
          "${model_args[@]}" \
          --json-out /tmp/async-need-results.json \
          | tee /tmp/async-need-stdout.txt

    - name: Job summary
      if: always()
      run: |
        {
          echo "# check-async-need eval"
          echo
          echo "runs=$EVAL_RUNS limit=$EVAL_LIMIT"
          echo
          echo '```'
          tail -n 40 /tmp/async-need-stdout.txt || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload full results
      if: always()
      # yamllint disable-line rule:line-length
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: async-need-results
        path: /tmp/async-need-results.json
        retention-days: 30

  check-override-drift:
    if: inputs.eval == 'check-override-drift' || inputs.eval == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: claude
    permissions:
      contents: read
    env:
      EVAL_RUNS: ${{ inputs.runs || '3' }}
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_EFFORT: ${{ inputs.effort }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        # full history: each case's override registry is read at its base commit
        fetch-depth: 0
        persist-credentials: false

    - name: Cache botocore repo
      # Both evals read botocore at specific tags. Shares the cache key with
      # botocore-sync.yml; fresh tags are always fetched below.
      # yamllint disable-line rule:line-length
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: /tmp/botocore
        key: botocore-repo

    - name: Clone or update botocore
      # Mirrors botocore-sync.yml's step exactly. Bare clone is smaller
      # (~100MB vs ~200MB) and scenarios.yaml references tags back to
      # 1.35.x, far past what a shallow clone would cover. On cache hit
      # the fetch is ~2s; on cache miss the initial clone is ~10-15s.
      run: |
        if [ -f /tmp/botocore/HEAD ]; then
          git -C /tmp/botocore fetch --tags --prune
        else
          git clone --bare \
            https://github.com/boto/botocore.git \
            /tmp/botocore
        fi

    - name: Set up uv + Python
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      with:
        version: '0.11.33'
        python-version: '3.12'
        enable-cache: auto

    # .venv caching: setup-uv caches uv's download cache (wheels), but
    # `uv sync` still walks the lockfile and re-links the venv every
    # run (~5-15s). Caching .venv directly short-circuits that on
    # lockfile-unchanged runs. Invalidates on uv.lock or pyproject.toml
    # changes.
    - name: Cache .venv
      # yamllint disable-line rule:line-length
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .venv
        # yamllint disable-line rule:line-length
        key: venv-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock', 'pyproject.toml') }}

    - name: Install dependencies
      # --frozen is a guardrail: fail (not silently resolve) if uv.lock
      # is somehow out of sync with pyproject.toml. On a warm .venv
      # cache uv sync is near-instant; on a miss it re-links from the
      # uv download cache.
      # --group evals pulls in anthropic (kept out of default-groups so the
      # no-httpx test job stays httpx-free).
      run: uv sync --frozen --group evals

    - name: Run check_override_drift eval
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        BOTOCORE_CLONE: /tmp/botocore
        # stack dump on a native crash; unbuffered so partial output survives it
        PYTHONFAULTHANDLER: '1'
        PYTHONUNBUFFERED: '1'
      run: |
        set -o pipefail
        model_args=()
        if [ -n "$EVAL_MODEL" ]; then model_args+=(--model "$EVAL_MODEL"); fi
        if [ -n "$EVAL_EFFORT" ]; then model_args+=(--effort "$EVAL_EFFORT"); fi
        uv run python plugins/aiobotocore-bot/evals/check_override_drift.py \
          --runs "$EVAL_RUNS" \
          "${model_args[@]}" \
          --json-out /tmp/drift-results.json \
          | tee /tmp/drift-stdout.txt

    - name: Job summary
      if: always()
      run: |
        {
          echo "# check-override-drift eval"
          echo
          echo "runs=$EVAL_RUNS"
          echo
          echo '```'
          tail -n 40 /tmp/drift-stdout.txt || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload full results
      if: always()
      # yamllint disable-line rule:line-length
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: drift-results
        path: /tmp/drift-results.json
        retention-days: 30

  check-porting:
    if: inputs.eval == 'check-porting'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: claude
    permissions:
      contents: read
    env:
      EVAL_CASES: ${{ inputs.cases }}
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_EFFORT: ${{ inputs.effort }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        # full history: each case checks out the sync's parent commit
        fetch-depth: 0
        persist-credentials: false

    - name: Cache botocore repo
      # Both evals read botocore at specific tags. Shares the cache key with
      # botocore-sync.yml; fresh tags are always fetched below.
      # yamllint disable-line rule:line-length
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: /tmp/botocore
        key: botocore-repo

    - name: Clone or update botocore
      # Mirrors botocore-sync.yml's step exactly. Bare clone is smaller
      # (~100MB vs ~200MB) and scenarios.yaml references tags back to
      # 1.35.x, far past what a shallow clone would cover. On cache hit
      # the fetch is ~2s; on cache miss the initial clone is ~10-15s.
      run: |
        if [ -f /tmp/botocore/HEAD ]; then
          git -C /tmp/botocore fetch --tags --prune
        else
          git clone --bare \
            https://github.com/boto/botocore.git \
            /tmp/botocore
        fi

    - name: Set up uv + Python
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      with:
        version: '0.11.33'
        python-version: '3.12'
        enable-cache: auto

    - name: Install dependencies
      run: uv sync --frozen --group evals

    - name: Install rtk (token-compacting command wrapper)
      env:
        RTK_VERSION: v0.42.3
        RTK_SHA256: 5df764a633709cb85d248258d085d24ec95faa8bca0e6835a93cd57cadc4eb9e
      run: |
        # yamllint disable-line rule:line-length
        url="https://github.com/rtk-ai/rtk/releases/download/${RTK_VERSION}/rtk-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSL "$url" -o /tmp/rtk.tar.gz
        echo "${RTK_SHA256}  /tmp/rtk.tar.gz" | sha256sum -c -
        # Install to /usr/local/bin (already on PATH) instead of writing
        # $GITHUB_PATH — avoids zizmor's github-env code-execution finding.
        sudo tar -xzf /tmp/rtk.tar.gz -C /usr/local/bin rtk
        rtk --version

    - name: Install Claude Code
      # lockfile-pinned to the version claude-code-action v1.0.236 bundles, so aliases resolve alike
      run: |
        npm ci --prefix .github/claude-code --no-audit --no-fund
        echo "$GITHUB_WORKSPACE/.github/claude-code/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run check_porting eval
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        BOTOCORE_CLONE: /tmp/botocore
        PYTHONFAULTHANDLER: '1'
        PYTHONUNBUFFERED: '1'
      run: |
        set -o pipefail
        if [ -z "$EVAL_CASES" ]; then
          echo "::error::check-porting needs explicit cases (PR numbers)"
          exit 1
        fi
        args=()
        IFS=',' read -ra arr <<< "$EVAL_CASES"
        for n in "${arr[@]}"; do args+=(--case "${n// /}"); done
        if [ -n "$EVAL_MODEL" ]; then args+=(--model "$EVAL_MODEL"); fi
        if [ -n "$EVAL_EFFORT" ]; then args+=(--effort "$EVAL_EFFORT"); fi
        uv run python plugins/aiobotocore-bot/evals/check_porting.py \
          "${args[@]}" \
          --json-out /tmp/porting-results.json \
          | tee /tmp/porting-stdout.txt

    - name: Job summary
      if: always()
      run: |
        {
          echo "# check-porting eval"
          echo
          echo '```'
          tail -n 40 /tmp/porting-stdout.txt || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload full results
      if: always()
      # yamllint disable-line rule:line-length
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: porting-results
        path: /tmp/porting-results.json
        retention-days: 30
