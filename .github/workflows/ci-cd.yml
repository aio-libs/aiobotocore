---
name: CI/CD

permissions: {}

on:
  merge_group:
  push:
    branches:
    - main
    tags:
    - >-
      [0-9]+.[0-9]+.[0-9]+
    - >-
      [0-9]+.[0-9]+.[0-9]+.dev[0-9]+
  pull_request:
    branches:
    - main
    - >-
      [0-9].[0-9]+.[0-9]+
  # Dispatch entry point for publishing a release. ``auto-release-on-merge``
  # calls this with ``-f tag=<version>`` after creating the tag + Release;
  # the publish must come from THIS workflow because PyPI's Trusted
  # Publisher is configured against ``ci-cd.yml`` and reusable workflows
  # are not currently supported (see https://docs.pypi.org/trusted-publishers/troubleshooting/).
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Version to publish to PyPI (e.g. ``3.7.0``). When set, the
          ``pypi-publish`` job runs against the build artifact from
          this run; the test matrix still gates publish.
        required: false
        type: string

# Superseded PR runs are wasted work -- a push should cancel the run it
# replaces. Two things must NOT be cancelled, and the group key handles both:
# ``event_name`` keeps pull_request, push, merge_group and workflow_dispatch in
# separate groups, and on ``main`` the SHA is folded in so every commit gets its
# own group. So merge-queue runs and the tag/dispatch publish path always run to
# completion; only a superseded PR head is cancelled.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{
    github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    && format('-{0}', github.sha)
    || '' }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml

  lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      enable-cache: ${{ github.ref_type == 'tag' && 'false' || 'auto' }}

  test:
    name: test${{ '' }}  # zizmor: ignore[obfuscation] nest jobs under the same sidebar category
    # The matrix consumes the dists rather than the checkout, so it can't start
    # until they exist. This is the dependency direction #1169 asks for.
    needs:
    - build
    strategy:
      matrix:
        python-version:
        - >-
          3.10
        - 3.11
        - 3.12
        - 3.13
        - 3.14
        os:
        - ubuntu-24.04
        with-awscrt:
        - false
        httpx-extra:  # preferred backend on the main matrix
        - httpx2
        experimental:
        - false
        include:
        # aiobotocore is pure Python, so arch only exercises the C-extension
        # deps' aarch64 wheels -- one run covers that for every interpreter.
        - python-version: 3.14  # add an arm64 run
          os: ubuntu-24.04-arm
          with-awscrt: false
          httpx-extra: httpx2
          experimental: false
        - python-version: 3.14  # add a no-httpx run
          os: ubuntu-24.04
          with-awscrt: false
          httpx-extra: ''
          experimental: false
        - python-version: 3.14  # add a legacy-httpx (deprecated fallback) run
          os: ubuntu-24.04
          with-awscrt: false
          httpx-extra: httpx
          experimental: false
        - python-version: 3.14  # add a with-awscrt run
          os: ubuntu-24.04
          with-awscrt: true
          httpx-extra: httpx2
          experimental: false
        # Prerelease interpreter: most C/Rust deps have no cp315 wheels yet,
        # so this run compiles them from sdists -- slow, and breakable by any
        # upstream release. Experimental until 3.15 is final.
        #
        # Pinned to an exact beta, not bare `3.15`: both the uv and .venv
        # cache keys embed this string, and betas share the `cp315` wheel tag
        # while breaking ABI, so a bare `3.15` restores extensions built
        # against the previous beta and segfaults. Bump to test a newer one.
        - python-version: 3.15.0b4
          os: ubuntu-24.04
          with-awscrt: false
          httpx-extra: httpx2
          experimental: true
          # ~4.5 min on a cold cache, nearly all of it cargo/cc
          timeout-minutes: 15
      fail-fast: false
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}
      continue-on-error: ${{ matrix.experimental }}
      enable-cache: ${{ github.ref_type == 'tag' && 'false' || 'auto' }}
      with-awscrt: ${{ matrix.with-awscrt }}
      httpx-extra: ${{ matrix.httpx-extra }}
      # Coverage costs ~20%, and interpreter version changes almost nothing in
      # the report -- but the backend does: aiobotocore/_httpx.py is only
      # reached by the legacy-httpx job, and awscrt swaps whole code paths. So
      # measure every 3.14 x86 job (one per backend variant) and no others.
      coverage: >-
        ${{ matrix.python-version == '3.14'
        && matrix.os == 'ubuntu-24.04' }}
      timeout-minutes: ${{ matrix.timeout-minutes || 15 }}
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  coverage-summary:
    name: Coverage processing
    if: >-
      !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    needs:
    - test
    steps:
    - name: Notify Codecov that all coverage reports have been uploaded
      if: >-
        !cancelled()
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
      with:
        fail_ci_if_error: true
        run_command: send-notifications

  zizmor:
    name: 🌈 zizmor
    permissions:
      security-events: write

    uses: zizmorcore/workflow/.github/workflows/reusable-zizmor.yml@465600191822382e76d26abf77772f21262ecdb6

  check:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
    - build
    - lint
    - test
    - zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
      with:
        jobs: ${{ toJSON(needs) }}

  pypi-publish:
    name: Publish Python 🐍 distribution 📦 to PyPI
    # Fires on either:
    #   * tag push of a release tag (manual ``git push origin X.Y.Z``)
    #   * workflow_dispatch with ``tag`` input (automated via
    #     ``auto-release-on-merge.yml`` after a ``Release v...`` PR merges)
    # Both paths use the *same* ``ci-cd.yml`` entry point so PyPI's
    # Trusted Publisher (configured against ``ci-cd.yml``) matches in
    # either case. Inlined here -- not a reusable workflow -- because
    # PyPI Trusted Publishing does not currently support reusable
    # workflows (#1595's first publish failure was caused by exactly
    # that mismatch).
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs:
    - check
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      # yamllint disable-line rule:line-length
      url: https://pypi.org/project/aiobotocore/${{ inputs.tag || github.ref_name }}
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    timeout-minutes: 5
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
    - name: Download distribution 📦
      # yamllint disable-line rule:line-length
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: python-package-distributions
        path: dist/
    - name: Check if distribution 📦 names match version
      run: |
        test -f "dist/aiobotocore-${VERSION}.tar.gz"
        test -f "dist/aiobotocore-${VERSION}-py3-none-any.whl"
    - name: Publish distribution 📦 to PyPI
      # yamllint disable-line rule:line-length
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
